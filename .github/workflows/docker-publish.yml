name: docker-publish

on:
  push:
    branches: [main]        # → :main (dev image)
    tags: ['v*']            # → :X.Y.Z :X.Y :X
  release:
    types: [published]      # → :latest as well
  pull_request:
    branches: [main]        # validation build, no push
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # metadata-action lowercases it
  # The image bundles the ldraw-nova toolkit through a second build context
  # (`nova`). Upstream builds both repos at the SAME tag: keep NOVA_REF on the
  # upstream release this fork's main is based on (see FORK.md).
  NOVA_REPOSITORY: anteloc/ldraw-nova
  NOVA_REF: v0.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image weighs ~5 GB (LeoCAD, the full LDraw parts library, Python
      # and Node stages): the stock runner's free disk is too tight without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          path: docker

      - name: Checkout ldraw-nova toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NOVA_REPOSITORY }}
          ref: ${{ env.NOVA_REF }}
          path: nova

      # No QEMU: the image is amd64 only (see platforms below).
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          build-contexts: nova=nova
          # amd64 only, even for stable releases: LeoCAD publishes x86_64-only
          # Linux AppImages, so an arm64 image cannot be built.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
